# Render Blueprint for the Oddfellow Letta backend.
#
# Why this exists: the currently-deployed service (oddfellow-letta-poc) was
# materialised from a Render environment variable (ODDFELLOW_LETTA_SRC) rather
# than built from a repository. Its Render metadata therefore reports
# repo=chatgpt-github-connection branch=main commit=1e04fb5, which is NOT the
# source that is actually running. That makes provenance unverifiable from the
# platform side -- you have to fetch the live OpenAPI document to find out what
# version is deployed.
#
# This blueprint makes the deploy reproducible: Render clones the branch, runs a
# normal pip install, and the git commit genuinely identifies the running code.
#
# Do NOT point this at the existing service until the replacement is verified.
# Preserve the current service as the rollback path.
#
#   Create:  Render dashboard -> New -> Blueprint -> pick this repo/branch
#   Secrets: LETTA_API_KEY and ODDFELLOW_OWNER_TOKEN use `sync: false`, so Render
#            prompts for them and never stores them in this file.

services:
  - type: web
    name: oddfellow-letta-backend
    runtime: python
    plan: free
    rootDir: oddfellow
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn oddfellow_letta_backend:app --host 0.0.0.0 --port $PORT
    # Liveness, NOT readiness. /healthz fails closed (503) when a required env
    # var is missing, which is correct -- but Render treats a non-200 health
    # check as a FAILED DEPLOY, so pointing this at /healthz turns "the secrets
    # have not been entered yet" into "the build failed", with no way to tell
    # the two apart from outside. That is what happened to the first deploy of
    # this service on 2026-09-30 (update_failed).
    #
    # /livez is always 200 while the process is up, and reports `ready` and
    # `checks_failed` in its body. /healthz still fails closed and remains the
    # readiness gate for humans and for the acceptance harness.
    healthCheckPath: /livez
    autoDeploy: false
    envVars:
      # Non-secret configuration, safe to commit.
      - key: LETTA_MODEL
        value: letta/auto
      - key: ODDFELLOW_AGENT_ID
        value: agent-a9a8eb2c-2fed-4554-9998-aa4783c7efc4
      - key: ODDFELLOW_RATE_PER_MIN
        value: "20"
      # This service serves the page as well as the API. Same origin means CORS
      # does not apply at all, so there is no origin to get wrong -- and the PWA
      # is installed from the same origin that serves the API, which is what the
      # phone needs. Path is relative to rootDir. Mounted last, so it cannot
      # shadow /api or /healthz.
      - key: ODDFELLOW_FRONTEND_DIR
        value: frontend
      # Kept so a *separate* front end service can still call this backend.
      # These are public URLs, not secrets. From v0.20.4 the value is a
      # comma-separated list. The allow-list previously named only
      # oddfellow-synthetic-v020 -- the front end with NO backend wiring --
      # while rejecting oddfellow-letta-ui-v020, the one that HAS it. That
      # mismatch presents in the browser as "Failed to fetch", which is
      # indistinguishable from a dead backend.
      # oddfellow-letta-ui-v020-pwa is the front end that is actually deployed
      # with the PWA icons and backend wiring (verified live 2026-09-30 02:35
      # UTC: 20897 B = commit 91b411c, /icons/icon-192.png -> 200). It was
      # missing from this list, so the one deployed front end that can reach a
      # backend was the one being rejected.
      - key: ALLOWED_ORIGIN
        value: https://oddfellow-letta-ui-v020-pwa.onrender.com,https://oddfellow-letta-ui-v020.onrender.com,https://oddfellow-synthetic-v020.onrender.com
      # Secrets. `sync: false` means Render prompts for the value at deploy time
      # and keeps it out of this file and out of git. Never fill these in here.
      - key: LETTA_API_KEY
        sync: false
      - key: ODDFELLOW_OWNER_TOKEN
        sync: false
