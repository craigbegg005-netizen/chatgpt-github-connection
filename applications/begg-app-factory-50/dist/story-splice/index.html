<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1014"><link rel="manifest" href="manifest.webmanifest"><title>Story Splice</title><style>
:root{color-scheme:dark;--bg:#0d1014;--card:#171c22;--line:#2c3540;--text:#f3f6f8;--muted:#9eabb8;--accent:#79dcff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:680px;margin:auto;padding:20px}h1{margin-bottom:4px}.sub{color:var(--muted);margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}input,button,textarea,select{font:inherit}input,textarea,select{width:100%;background:#10151a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}button{background:var(--accent);color:#051118;border:0;border-radius:10px;padding:11px 14px;font-weight:750;cursor:pointer}.secondary{background:#2a333d;color:var(--text)}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.item span{flex:1}.big{font-size:3rem;font-weight:800;text-align:center}.small{font-size:.85rem;color:var(--muted)}
a{color:inherit;text-decoration:none}</style></head><body><main><h1>Story Splice</h1><div class="sub">Turn an idea into a creative writing challenge.</div><section class="card"><label for="seed">Your starting idea</label><input id="seed" maxlength="100" placeholder="An abandoned lighthouse"><button id="spin">Make a story prompt</button><div id="prompt" class="card" role="status" style="font-size:1.25rem;line-height:1.5">Add an idea and make a prompt.</div><button id="copy" class="secondary">Copy prompt</button></section><div class="small">Local-first · no account required</div></main><script>const places=['during a citywide blackout','at the edge of a floating market','on the last train of the night','inside a forgotten museum'],twists=['a stranger knows its secret','a message arrives from the future','the smallest detail changes everything','the map points back home'],limits=['Tell it in six sentences.','Begin with dialogue.','Use no character names.','End with a question.'];let output=document.getElementById('prompt');document.getElementById('spin').addEventListener('click',()=>{let seed=document.getElementById('seed').value.trim();if(!seed){output.textContent='Add a starting idea first.';return}let choose=a=>a[Math.floor(Math.random()*a.length)];output.textContent='Write about '+seed+' '+choose(places)+'. '+choose(twists)+'. '+choose(limits)});document.getElementById('copy').addEventListener('click',async()=>{if(output.textContent.startsWith('Write about ')){try{await navigator.clipboard.writeText(output.textContent)}catch{output.textContent+=' Select and copy this text.'}}});</script></body></html>
