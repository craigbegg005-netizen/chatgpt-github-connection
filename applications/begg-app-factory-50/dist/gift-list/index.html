<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1014"><link rel="manifest" href="manifest.webmanifest"><title>Gift List</title><style>
:root{color-scheme:dark;--bg:#0d1014;--card:#171c22;--line:#2c3540;--text:#f3f6f8;--muted:#9eabb8;--accent:#79dcff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:680px;margin:auto;padding:20px}h1{margin-bottom:4px}.sub{color:var(--muted);margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}input,button,textarea,select{font:inherit}input,textarea,select{width:100%;background:#10151a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}button{background:var(--accent);color:#051118;border:0;border-radius:10px;padding:11px 14px;font-weight:750;cursor:pointer}.secondary{background:#2a333d;color:var(--text)}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.item span{flex:1}.big{font-size:3rem;font-weight:800;text-align:center}.small{font-size:.85rem;color:var(--muted)}
a{color:inherit;text-decoration:none}</style></head><body><main><h1>Gift List</h1><div class="sub">Keep gift ideas organized on-device.</div><section class="card"><div class="row"><input id="new" placeholder="Add item" aria-label="Add item"><button onclick="add()">Add</button></div><div id="items"></div></section><div class="small">Local-first · no account required</div></main><script>const K="begg:gift-list:items";function loadItems(){try{let value=JSON.parse(localStorage.getItem(K)||'[]');return Array.isArray(value)?value.filter(x=>x&&typeof x.text==='string').map(x=>({text:x.text,done:x.done===true})):[]}catch{return[]}}let items=loadItems();function save(){localStorage.setItem(K,JSON.stringify(items));draw()}function add(){let e=document.getElementById('new'),v=e.value.trim();if(!v)return;items.push({text:v,done:false});e.value='';save()}function toggle(i){items[i].done=!items[i].done;save()}function del(i){items.splice(i,1);save()}function draw(){document.getElementById('items').innerHTML=items.map((x,i)=>`<div class="item"><input type="checkbox" aria-label="${x.done?'Mark incomplete: ':'Mark complete: '}${esc(x.text)}" ${x.done?'checked':''} onchange="toggle(${i})"><span style="${x.done?'text-decoration:line-through;opacity:.55':''}">${esc(x.text)}</span><button class="secondary" aria-label="Delete ${esc(x.text)}" onclick="del(${i})">x</button></div>`).join('')}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}draw();</script></body></html>
