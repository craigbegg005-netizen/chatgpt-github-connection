<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1014"><link rel="manifest" href="manifest.webmanifest"><title>Hangman Lite</title><style>
:root{color-scheme:dark;--bg:#0d1014;--card:#171c22;--line:#2c3540;--text:#f3f6f8;--muted:#9eabb8;--accent:#79dcff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:680px;margin:auto;padding:20px}h1{margin-bottom:4px}.sub{color:var(--muted);margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}input,button,textarea,select{font:inherit}input,textarea,select{width:100%;background:#10151a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}button{background:var(--accent);color:#051118;border:0;border-radius:10px;padding:11px 14px;font-weight:750;cursor:pointer}.secondary{background:#2a333d;color:var(--text)}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.item span{flex:1}.big{font-size:3rem;font-weight:800;text-align:center}.small{font-size:.85rem;color:var(--muted)}
a{color:inherit;text-decoration:none}</style></head><body><main><h1>Hangman Lite</h1><div class="sub">Guess the everyday word before your misses run out.</div><section class="card"><div id="word" class="big" style="font-size:2rem;letter-spacing:.2em"></div><input id="guess" maxlength="1" placeholder="Letter" aria-label="Letter"><br><br><button onclick="go()">Guess</button><div id="msg" class="small" style="margin-top:10px"></div><button class="secondary" onclick="newGame()" style="margin-top:10px">New word</button></section><div class="small">Local-first · no account required</div></main><script>const words=['garden','planet','window','coffee','basket','summer','pillow','rocket'];let w='',seen=new Set(),miss=0;function draw(){word.textContent=[...w].map(c=>seen.has(c)?c:'_').join(' ');msg.textContent='misses: '+miss+'/6';if([...w].every(c=>seen.has(c)))msg.textContent='You got it!'}function go(){let c=guess.value.toLowerCase();guess.value='';if(!/^[a-z]$/.test(c)||seen.has(c))return;seen.add(c);if(!w.includes(c))miss++;if(miss>=6){word.textContent=w;msg.textContent='Out of guesses'}else draw()}function newGame(){w=words[Math.floor(Math.random()*words.length)];seen=new Set();miss=0;draw()}newGame();</script></body></html>
