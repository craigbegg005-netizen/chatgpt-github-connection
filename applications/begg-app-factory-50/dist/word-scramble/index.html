<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1014"><link rel="manifest" href="manifest.webmanifest"><title>Word Scramble</title><style>
:root{color-scheme:dark;--bg:#0d1014;--card:#171c22;--line:#2c3540;--text:#f3f6f8;--muted:#9eabb8;--accent:#79dcff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:680px;margin:auto;padding:20px}h1{margin-bottom:4px}.sub{color:var(--muted);margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}input,button,textarea,select{font:inherit}input,textarea,select{width:100%;background:#10151a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}button{background:var(--accent);color:#051118;border:0;border-radius:10px;padding:11px 14px;font-weight:750;cursor:pointer}.secondary{background:#2a333d;color:var(--text)}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.item span{flex:1}.big{font-size:3rem;font-weight:800;text-align:center}.small{font-size:.85rem;color:var(--muted)}
a{color:inherit;text-decoration:none}</style></head><body><main><h1>Word Scramble</h1><div class="sub">Unscramble a rotating set of everyday words.</div><section class="card"><div id="scramble" class="big" style="font-size:2rem"></div><input id="guess" placeholder="Your guess" aria-label="Your guess"><br><br><div class="row"><button onclick="check()">Check</button><button class="secondary" onclick="next()">Skip</button></div><div id="msg" class="small" style="margin-top:10px"></div></section><div class="small">Local-first · no account required</div></main><script>const words=['garden','coffee','window','planet','basket','summer','pillow','market'];let word='';function next(){word=words[Math.floor(Math.random()*words.length)];scramble.textContent=word.split('').sort(()=>Math.random()-.5).join('').toUpperCase();guess.value='';msg.textContent=''}function check(){if(guess.value.trim().toLowerCase()===word){msg.textContent='Correct!';setTimeout(next,500)}else msg.textContent='Try again'}next();</script></body></html>
