<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1014"><link rel="manifest" href="manifest.webmanifest"><title>Savings Target</title><style>
:root{color-scheme:dark;--bg:#0d1014;--card:#171c22;--line:#2c3540;--text:#f3f6f8;--muted:#9eabb8;--accent:#79dcff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:680px;margin:auto;padding:20px}h1{margin-bottom:4px}.sub{color:var(--muted);margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}input,button,textarea,select{font:inherit}input,textarea,select{width:100%;background:#10151a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}button{background:var(--accent);color:#051118;border:0;border-radius:10px;padding:11px 14px;font-weight:750;cursor:pointer}.secondary{background:#2a333d;color:var(--text)}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.item span{flex:1}.big{font-size:3rem;font-weight:800;text-align:center}.small{font-size:.85rem;color:var(--muted)}
a{color:inherit;text-decoration:none}</style></head><body><main><h1>Savings Target</h1><div class="sub">Turn a savings goal into a simple weekly or monthly target.</div><section class="card"><label for="goal">Goal amount</label><input id="goal" type="number" value="1000"><br><br><label for="months">Months</label><input id="months" type="number" min="1" value="6"><br><br><button onclick="calc()">Plan</button><div id="out" class="big" style="font-size:1.7rem"></div><div class="small">Simple target only; no investment assumptions.</div></section><div class="small">Local-first · no account required</div></main><script>function money(v){return v.toLocaleString(undefined,{style:'currency',currency:'USD'})}function calc(){let g=Math.max(0,Number(goal.value)),m=Math.max(1,Number(months.value));out.textContent=money(g/m)+'/month · '+money(g/(m*4.345))+'/week';}calc();</script></body></html>
