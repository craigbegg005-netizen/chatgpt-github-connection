<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1014"><link rel="manifest" href="manifest.webmanifest"><title>Loan Snapshot</title><style>
:root{color-scheme:dark;--bg:#0d1014;--card:#171c22;--line:#2c3540;--text:#f3f6f8;--muted:#9eabb8;--accent:#79dcff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:680px;margin:auto;padding:20px}h1{margin-bottom:4px}.sub{color:var(--muted);margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}input,button,textarea,select{font:inherit}input,textarea,select{width:100%;background:#10151a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}button{background:var(--accent);color:#051118;border:0;border-radius:10px;padding:11px 14px;font-weight:750;cursor:pointer}.secondary{background:#2a333d;color:var(--text)}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.item span{flex:1}.big{font-size:3rem;font-weight:800;text-align:center}.small{font-size:.85rem;color:var(--muted)}
a{color:inherit;text-decoration:none}</style></head><body><main><h1>Loan Snapshot</h1><div class="sub">Estimate a fixed monthly payment from amount, rate, and term.</div><section class="card"><label for="principal">Loan amount</label><input id="principal" type="number" value="10000"><br><br><label for="rate">Annual rate %</label><input id="rate" type="number" step="0.01" value="8"><br><br><label for="months">Term (months)</label><input id="months" type="number" value="36"><br><br><button onclick="calc()">Estimate</button><div id="out" class="big" style="font-size:1.8rem"></div><div class="small">Estimate only; fees and lender terms can change actual payments.</div></section><div class="small">Local-first · no account required</div></main><script>function calc(){let P=Number(principal.value),n=Math.max(1,Number(months.value)),r=Number(rate.value)/1200;let pay=r===0?P/n:P*r/(1-Math.pow(1+r,-n));out.textContent=pay.toLocaleString(undefined,{style:'currency',currency:'USD'})+'/mo';}calc();</script></body></html>
