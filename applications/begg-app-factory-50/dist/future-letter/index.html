<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1014"><link rel="manifest" href="manifest.webmanifest"><title>Future Letter</title><style>
:root{color-scheme:dark;--bg:#0d1014;--card:#171c22;--line:#2c3540;--text:#f3f6f8;--muted:#9eabb8;--accent:#79dcff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:680px;margin:auto;padding:20px}h1{margin-bottom:4px}.sub{color:var(--muted);margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}input,button,textarea,select{font:inherit}input,textarea,select{width:100%;background:#10151a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}button{background:var(--accent);color:#051118;border:0;border-radius:10px;padding:11px 14px;font-weight:750;cursor:pointer}.secondary{background:#2a333d;color:var(--text)}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.item span{flex:1}.big{font-size:3rem;font-weight:800;text-align:center}.small{font-size:.85rem;color:var(--muted)}
a{color:inherit;text-decoration:none}</style></head><body><main><h1>Future Letter</h1><div class="sub">Seal a note to open on a chosen date.</div><section class="card"><label for="message">Note to your future self</label><textarea id="message" rows="5" maxlength="2000"></textarea><label for="date">Open on or after</label><input id="date" type="date"><button id="seal">Seal note</button><p id="feedback" role="status"></p></section><section class="card"><h2>Sealed notes</h2><div id="notes"></div></section><div class="small">Local-first · no account required</div></main><script>const K='begg:future-letter',message=document.getElementById('message'),date=document.getElementById('date'),notes=document.getElementById('notes'),feedback=document.getElementById('feedback');let entries;try{let value=JSON.parse(localStorage.getItem(K)||'[]');entries=Array.isArray(value)?value.filter(x=>x&&typeof x.text==='string'&&typeof x.date==='string'):[]}catch{entries=[]}const today=()=>new Date().toLocaleDateString('en-CA');date.min=today();function draw(){notes.replaceChildren();if(!entries.length){notes.textContent='No notes sealed yet.';return}entries.forEach((item,i)=>{let row=document.createElement('div');row.className='item';let text=document.createElement('span');text.textContent=item.date<=today()?item.text:'Sealed until '+item.date;let remove=document.createElement('button');remove.className='secondary';remove.textContent='Delete';remove.setAttribute('aria-label','Delete note for '+item.date);remove.addEventListener('click',()=>{entries.splice(i,1);save()});row.append(text,remove);notes.append(row)})}function save(){localStorage.setItem(K,JSON.stringify(entries));draw()}document.getElementById('seal').addEventListener('click',()=>{let text=message.value.trim();if(!text||!date.value||date.value<today()){feedback.textContent='Add a note and a future date.';return}entries.push({text,date:date.value});save();message.value='';feedback.textContent='Note sealed on this device.'});draw();</script></body></html>
