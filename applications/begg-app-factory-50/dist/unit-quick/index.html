<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1014"><link rel="manifest" href="manifest.webmanifest"><title>Unit Quick</title><style>
:root{color-scheme:dark;--bg:#0d1014;--card:#171c22;--line:#2c3540;--text:#f3f6f8;--muted:#9eabb8;--accent:#79dcff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:680px;margin:auto;padding:20px}h1{margin-bottom:4px}.sub{color:var(--muted);margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}input,button,textarea,select{font:inherit}input,textarea,select{width:100%;background:#10151a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}button{background:var(--accent);color:#051118;border:0;border-radius:10px;padding:11px 14px;font-weight:750;cursor:pointer}.secondary{background:#2a333d;color:var(--text)}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.item span{flex:1}.big{font-size:3rem;font-weight:800;text-align:center}.small{font-size:.85rem;color:var(--muted)}
a{color:inherit;text-decoration:none}</style></head><body><main><h1>Unit Quick</h1><div class="sub">Convert common distance, weight, and temperature units.</div><section class="card"><label for="value">Value</label><input id="value" type="number" value="1"><br><br><label for="mode">Conversion</label><select id="mode"><option value="mi-km">Miles to km</option><option value="km-mi">Km to miles</option><option value="lb-kg">Pounds to kg</option><option value="kg-lb">Kg to pounds</option><option value="f-c">F to C</option><option value="c-f">C to F</option></select><br><br><button onclick="calc()">Convert</button><div id="out" class="big" style="font-size:2rem"></div></section><div class="small">Local-first · no account required</div></main><script>function calc(){let v=Number(value.value),m=mode.value,r,u;if(m==='mi-km'){r=v*1.609344;u=' km'}if(m==='km-mi'){r=v/1.609344;u=' mi'}if(m==='lb-kg'){r=v*0.45359237;u=' kg'}if(m==='kg-lb'){r=v/0.45359237;u=' lb'}if(m==='f-c'){r=(v-32)*5/9;u=' C'}if(m==='c-f'){r=v*9/5+32;u=' F'}out.textContent=r.toFixed(2)+u;}calc();</script></body></html>
