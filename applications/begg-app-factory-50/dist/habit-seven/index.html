<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1014"><link rel="manifest" href="manifest.webmanifest"><title>Habit Seven</title><style>
:root{color-scheme:dark;--bg:#0d1014;--card:#171c22;--line:#2c3540;--text:#f3f6f8;--muted:#9eabb8;--accent:#79dcff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:680px;margin:auto;padding:20px}h1{margin-bottom:4px}.sub{color:var(--muted);margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}input,button,textarea,select{font:inherit}input,textarea,select{width:100%;background:#10151a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}button{background:var(--accent);color:#051118;border:0;border-radius:10px;padding:11px 14px;font-weight:750;cursor:pointer}.secondary{background:#2a333d;color:var(--text)}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.item span{flex:1}.big{font-size:3rem;font-weight:800;text-align:center}.small{font-size:.85rem;color:var(--muted)}
a{color:inherit;text-decoration:none}</style></head><body><main><h1>Habit Seven</h1><div class="sub">Track one habit across a simple seven-day grid.</div><section class="card"><input id="name" placeholder="Habit name" aria-label="Habit name"><div id="days" class="row" style="margin-top:12px;flex-wrap:wrap"></div><div id="score" class="small" style="margin-top:10px"></div><button class="secondary" onclick="reset()" style="margin-top:10px">Reset week</button></section><div class="small">Local-first · no account required</div></main><script>const K="begg:habit-seven:habit",fresh=()=>({name:'',days:Array(7).fill(false)});function loadHabit(){try{let value=JSON.parse(localStorage.getItem(K)||'null');return value&&typeof value.name==='string'&&Array.isArray(value.days)&&value.days.length===7&&value.days.every(x=>typeof x==='boolean')?value:fresh()}catch{return fresh()}}let st=loadHabit();document.getElementById('name').value=st.name;document.getElementById('name').oninput=()=>{st.name=document.getElementById('name').value;save()};function save(){localStorage.setItem(K,JSON.stringify(st));draw()}function toggle(i){st.days[i]=!st.days[i];save()}function reset(){st.days=Array(7).fill(false);save()}function draw(){let labels=['M','T','W','T','F','S','S'];days.innerHTML=labels.map((x,i)=>`<button class="${st.days[i]?'':'secondary'}" onclick="toggle(${i})">${x}</button>`).join('');score.textContent=st.days.filter(Boolean).length+'/7 complete'}draw();</script></body></html>
