<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1014"><link rel="manifest" href="manifest.webmanifest"><title>Reaction Light</title><style>
:root{color-scheme:dark;--bg:#0d1014;--card:#171c22;--line:#2c3540;--text:#f3f6f8;--muted:#9eabb8;--accent:#79dcff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:680px;margin:auto;padding:20px}h1{margin-bottom:4px}.sub{color:var(--muted);margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}input,button,textarea,select{font:inherit}input,textarea,select{width:100%;background:#10151a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}button{background:var(--accent);color:#051118;border:0;border-radius:10px;padding:11px 14px;font-weight:750;cursor:pointer}.secondary{background:#2a333d;color:var(--text)}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.item span{flex:1}.big{font-size:3rem;font-weight:800;text-align:center}.small{font-size:.85rem;color:var(--muted)}
a{color:inherit;text-decoration:none}</style></head><body><main><h1>Reaction Light</h1><div class="sub">Wait for green, then tap as fast as you can.</div><section class="card"><div id="box" style="height:220px;border-radius:14px;background:#303944;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800" onclick="tap()">Tap to start</div><div id="msg" class="small" style="margin-top:10px"></div></section><div class="small">Local-first · no account required</div></main><script>let ready=false,start=0,t=null,active=false;function tap(){if(!active){active=true;ready=false;box.style.background='#6a4b23';box.textContent='Wait...';t=setTimeout(()=>{ready=true;start=performance.now();box.style.background='#2f8b57';box.textContent='TAP!'},800+Math.random()*2200);return}if(!ready){clearTimeout(t);active=false;box.style.background='#303944';box.textContent='Too soon - tap to retry';msg.textContent='';return}let ms=Math.round(performance.now()-start);active=false;ready=false;box.style.background='#303944';box.textContent='Tap to go again';msg.textContent=ms+' ms';}</script></body></html>
