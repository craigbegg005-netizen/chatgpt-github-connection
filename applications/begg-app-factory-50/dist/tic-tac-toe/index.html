<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1014"><link rel="manifest" href="manifest.webmanifest"><title>Tic Tac Toe</title><style>
:root{color-scheme:dark;--bg:#0d1014;--card:#171c22;--line:#2c3540;--text:#f3f6f8;--muted:#9eabb8;--accent:#79dcff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:680px;margin:auto;padding:20px}h1{margin-bottom:4px}.sub{color:var(--muted);margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}input,button,textarea,select{font:inherit}input,textarea,select{width:100%;background:#10151a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}button{background:var(--accent);color:#051118;border:0;border-radius:10px;padding:11px 14px;font-weight:750;cursor:pointer}.secondary{background:#2a333d;color:var(--text)}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.item span{flex:1}.big{font-size:3rem;font-weight:800;text-align:center}.small{font-size:.85rem;color:var(--muted)}
a{color:inherit;text-decoration:none}</style></head><body><main><h1>Tic Tac Toe</h1><div class="sub">Classic two-player tic-tac-toe on one screen.</div><section class="card"><div id="board" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px"></div><div id="msg" class="small" style="margin:10px 0"></div><button class="secondary" onclick="reset()">New game</button></section><div class="small">Local-first · no account required</div></main><script>let b=Array(9).fill(''),turn='X',over=false;const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];function draw(){board.innerHTML=b.map((v,i)=>`<button aria-label="Cell ${i+1}: ${v||'empty'}" style="height:80px;font-size:2rem" onclick="go(${i})">${v}</button>`).join('');if(!over)msg.textContent='Turn: '+turn}function go(i){if(over||b[i])return;b[i]=turn;let win=wins.some(a=>a.every(j=>b[j]===turn));if(win){over=true;msg.textContent=turn+' wins!'}else if(b.every(Boolean)){over=true;msg.textContent='Draw'}else turn=turn==='X'?'O':'X';draw()}function reset(){b=Array(9).fill('');turn='X';over=false;msg.textContent='';draw()}reset();</script></body></html>
