<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1014"><link rel="manifest" href="manifest.webmanifest"><title>Tiny Museum</title><style>
:root{color-scheme:dark;--bg:#0d1014;--card:#171c22;--line:#2c3540;--text:#f3f6f8;--muted:#9eabb8;--accent:#79dcff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:680px;margin:auto;padding:20px}h1{margin-bottom:4px}.sub{color:var(--muted);margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}input,button,textarea,select{font:inherit}input,textarea,select{width:100%;background:#10151a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}button{background:var(--accent);color:#051118;border:0;border-radius:10px;padding:11px 14px;font-weight:750;cursor:pointer}.secondary{background:#2a333d;color:var(--text)}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.item span{flex:1}.big{font-size:3rem;font-weight:800;text-align:center}.small{font-size:.85rem;color:var(--muted)}
a{color:inherit;text-decoration:none}</style></head><body><main><h1>Tiny Museum</h1><div class="sub">Keep a personal collection of meaningful moments.</div><section class="card"><label for="title">Object or moment</label><input id="title" maxlength="80" placeholder="A stone from the river"><label for="detail">Why keep it?</label><textarea id="detail" rows="3" maxlength="600"></textarea><button id="add">Add exhibit</button><p id="feedback" role="status"></p></section><section class="card"><div class="row"><h2>My exhibits</h2><button id="export" class="secondary">Export JSON</button></div><div id="exhibits"></div></section><div class="small">Local-first · no account required</div></main><script>const K='begg:tiny-museum',title=document.getElementById('title'),detail=document.getElementById('detail'),exhibits=document.getElementById('exhibits'),feedback=document.getElementById('feedback');let items;try{let value=JSON.parse(localStorage.getItem(K)||'[]');items=Array.isArray(value)?value.filter(x=>x&&typeof x.title==='string'&&x.title&&typeof x.detail==='string'&&typeof x.date==='string'):[]}catch{items=[]}function draw(){exhibits.replaceChildren();if(!items.length){exhibits.textContent='Your collection is empty.';return}items.forEach((item,i)=>{let card=document.createElement('article');card.className='item';let content=document.createElement('span');let name=document.createElement('strong');name.textContent=item.title;let note=document.createElement('p');note.textContent=item.detail;let stamp=document.createElement('small');stamp.textContent=item.date;content.append(name,note,stamp);let remove=document.createElement('button');remove.className='secondary';remove.textContent='Remove';remove.setAttribute('aria-label','Remove exhibit '+item.title);remove.addEventListener('click',()=>{items.splice(i,1);save()});card.append(content,remove);exhibits.append(card)})}function save(){localStorage.setItem(K,JSON.stringify(items));draw()}document.getElementById('add').addEventListener('click',()=>{if(!title.value.trim()){feedback.textContent='Name the exhibit first.';return}items.unshift({title:title.value.trim(),detail:detail.value.trim(),date:new Date().toLocaleDateString()});save();title.value='';detail.value='';feedback.textContent='Exhibit added.'});document.getElementById('export').addEventListener('click',()=>{let blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tiny-museum.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});draw();</script></body></html>
