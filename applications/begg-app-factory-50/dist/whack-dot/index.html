<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1014"><link rel="manifest" href="manifest.webmanifest"><title>Whack Dot</title><style>
:root{color-scheme:dark;--bg:#0d1014;--card:#171c22;--line:#2c3540;--text:#f3f6f8;--muted:#9eabb8;--accent:#79dcff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:680px;margin:auto;padding:20px}h1{margin-bottom:4px}.sub{color:var(--muted);margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}input,button,textarea,select{font:inherit}input,textarea,select{width:100%;background:#10151a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}button{background:var(--accent);color:#051118;border:0;border-radius:10px;padding:11px 14px;font-weight:750;cursor:pointer}.secondary{background:#2a333d;color:var(--text)}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.item span{flex:1}.big{font-size:3rem;font-weight:800;text-align:center}.small{font-size:.85rem;color:var(--muted)}
a{color:inherit;text-decoration:none}</style></head><body><main><h1>Whack Dot</h1><div class="sub">Tap the moving target before time runs out.</div><section class="card"><div id="arena" style="height:260px;position:relative;border:1px solid #2c3540;border-radius:12px"><button id="dot" style="position:absolute;width:58px;height:58px;border-radius:50%" onclick="hit()">O</button></div><div id="score" class="small" style="margin-top:10px"></div><button class="secondary" onclick="start()" style="margin-top:10px">Start 15s</button></section><div class="small">Local-first · no account required</div></main><script>let s=0,left=0,t=null;function move(){dot.style.left=Math.floor(Math.random()*Math.max(1,arena.clientWidth-60))+'px';dot.style.top=Math.floor(Math.random()*200)+'px'}function hit(){if(left>0){s++;move();draw()}}function draw(){score.textContent='score: '+s+' · '+left+'s'}function start(){clearInterval(t);s=0;left=15;move();draw();t=setInterval(()=>{left--;draw();if(left<=0)clearInterval(t)},1000)}move();draw();</script></body></html>
