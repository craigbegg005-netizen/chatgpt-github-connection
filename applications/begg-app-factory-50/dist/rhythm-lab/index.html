<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1014"><link rel="manifest" href="manifest.webmanifest"><title>Rhythm Lab</title><style>
:root{color-scheme:dark;--bg:#0d1014;--card:#171c22;--line:#2c3540;--text:#f3f6f8;--muted:#9eabb8;--accent:#79dcff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:680px;margin:auto;padding:20px}h1{margin-bottom:4px}.sub{color:var(--muted);margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}input,button,textarea,select{font:inherit}input,textarea,select{width:100%;background:#10151a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}button{background:var(--accent);color:#051118;border:0;border-radius:10px;padding:11px 14px;font-weight:750;cursor:pointer}.secondary{background:#2a333d;color:var(--text)}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.item span{flex:1}.big{font-size:3rem;font-weight:800;text-align:center}.small{font-size:.85rem;color:var(--muted)}
a{color:inherit;text-decoration:none}</style></head><body><main><h1>Rhythm Lab</h1><div class="sub">Make an eight-step beat in your browser.</div><section class="card"><label for="tempo">Tempo <output id="speed">100</output> BPM</label><input id="tempo" type="range" min="50" max="180" value="100"><div id="steps" style="display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:20px 0"></div><div class="row"><button id="play">Play</button><button id="clear" class="secondary">Clear</button></div><p class="small">Tap steps to build an eight-beat rhythm. Sound starts when you press Play.</p></section><div class="small">Local-first · no account required</div></main><script>const K='begg:rhythm-lab',steps=document.getElementById('steps'),tempo=document.getElementById('tempo'),speed=document.getElementById('speed'),play=document.getElementById('play');let pattern;try{pattern=JSON.parse(localStorage.getItem(K)||'[]')}catch{pattern=[]}if(!Array.isArray(pattern)||pattern.length!==8||!pattern.every(x=>typeof x==='boolean'))pattern=[true,false,false,false,true,false,true,false];let pos=0,timer=null,audio=null;function draw(){steps.replaceChildren();pattern.forEach((on,i)=>{let b=document.createElement('button');b.textContent=String(i+1);b.setAttribute('aria-label','Beat '+(i+1));b.setAttribute('aria-pressed',String(on));b.style.background=on?'#79dcff':'#2a333d';b.style.color=on?'#051118':'#f3f6f8';b.style.outline=timer&&pos===i?'3px solid #ffc766':'none';b.addEventListener('click',()=>{pattern[i]=!pattern[i];localStorage.setItem(K,JSON.stringify(pattern));draw()});steps.append(b)})}function tick(){if(pattern[pos]&&audio){let o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(pos%4===0?880:550,audio.currentTime);g.gain.setValueAtTime(.12,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.08);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.08)}draw();pos=(pos+1)%8}function stop(){clearInterval(timer);timer=null;play.textContent='Play';draw()}play.addEventListener('click',()=>{if(timer){stop();return}audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume();pos=0;tick();timer=setInterval(tick,60000/Number(tempo.value)/2);play.textContent='Pause'});tempo.addEventListener('input',()=>{speed.textContent=tempo.value;if(timer){stop();play.click()}});document.getElementById('clear').addEventListener('click',()=>{pattern=Array(8).fill(false);localStorage.setItem(K,JSON.stringify(pattern));draw()});draw();</script></body></html>
