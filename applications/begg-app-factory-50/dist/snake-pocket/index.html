<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1014"><link rel="manifest" href="manifest.webmanifest"><title>Snake Pocket</title><style>
:root{color-scheme:dark;--bg:#0d1014;--card:#171c22;--line:#2c3540;--text:#f3f6f8;--muted:#9eabb8;--accent:#79dcff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:680px;margin:auto;padding:20px}h1{margin-bottom:4px}.sub{color:var(--muted);margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}input,button,textarea,select{font:inherit}input,textarea,select{width:100%;background:#10151a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}button{background:var(--accent);color:#051118;border:0;border-radius:10px;padding:11px 14px;font-weight:750;cursor:pointer}.secondary{background:#2a333d;color:var(--text)}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.item span{flex:1}.big{font-size:3rem;font-weight:800;text-align:center}.small{font-size:.85rem;color:var(--muted)}
a{color:inherit;text-decoration:none}</style></head><body><main><h1>Snake Pocket</h1><div class="sub">A compact keyboard-and-button snake game.</div><section class="card"><canvas id="cv" width="300" height="300" style="width:100%;max-width:300px;display:block;margin:auto;background:#10151a;border:1px solid #2c3540"></canvas><div class="row" style="margin-top:10px"><button onclick="turn(0,-1)">Up</button><button onclick="turn(-1,0)">Left</button><button onclick="turn(1,0)">Right</button><button onclick="turn(0,1)">Down</button></div><div id="msg" class="small" style="margin-top:10px"></div><button class="secondary" onclick="reset()" style="margin-top:10px">Restart</button></section><div class="small">Local-first · no account required</div></main><script>const ctx=cv.getContext('2d'),N=15,S=20;let snake,dx,dy,food,t,score;function foodNew(){food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}function reset(){snake=[{x:7,y:7}];dx=1;dy=0;score=0;foodNew();clearInterval(t);t=setInterval(step,140);draw()}function turn(x,y){if(x===-dx&&y===-dy)return;dx=x;dy=y}function step(){let h={x:snake[0].x+dx,y:snake[0].y+dy};if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(p=>p.x===h.x&&p.y===h.y)){clearInterval(t);msg.textContent='Game over · score '+score;return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score++;foodNew()}else snake.pop();draw()}function draw(){ctx.clearRect(0,0,300,300);ctx.fillStyle='#79dcff';snake.forEach(p=>ctx.fillRect(p.x*S+1,p.y*S+1,S-2,S-2));ctx.fillStyle='#ffc766';ctx.fillRect(food.x*S+3,food.y*S+3,S-6,S-6);msg.textContent='score: '+score}document.addEventListener('keydown',e=>{if(e.key==='ArrowUp')turn(0,-1);if(e.key==='ArrowDown')turn(0,1);if(e.key==='ArrowLeft')turn(-1,0);if(e.key==='ArrowRight')turn(1,0)});reset();</script></body></html>
