<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1014"><link rel="manifest" href="manifest.webmanifest"><title>Passphrase Maker</title><style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:680px;margin:auto;padding:20px}h1{margin-bottom:4px}.sub{color:var(--muted);margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}input,button,textarea,select{font:inherit}input,textarea,select{width:100%;background:#10151a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}button{background:var(--accent);color:#051118;border:0;border-radius:10px;padding:11px 14px;font-weight:750;cursor:pointer}.secondary{background:#2a333d;color:var(--text)}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}.item span{flex:1}.big{font-size:3rem;font-weight:800;text-align:center}.small{font-size:.85rem;color:var(--muted)}
a{color:inherit;text-decoration:none}</style></head><body><main><h1>Passphrase Maker</h1><div class="sub">Generate a local random passphrase without sending data anywhere.</div><section class="card"><label for="n">Words</label><input id="n" type="number" min="6" max="8" value="6"><br><br><button onclick="make()">Generate locally</button><div id="out" class="big" role="status" aria-live="polite" aria-atomic="true" style="font-size:1.3rem;word-break:break-word"></div><div class="small">Generated in your browser using cryptographic randomness.</div></section><div class="small">Local-first · no account required</div></main><script>const starts=['alpine','amber','april','aqua','arctic','autumn','blue','brave','breezy','bright','bronze','calm','cedar','cherry','copper','coral','crisp','crystal','dawn','deep','eager','early','ember','fair','fern','fresh','gentle','golden','grand','green','happy','hazel','hidden','ivory','jade','keen','kind','light','lively','lucky','lunar','maple','merry','misty','moon','noble','north','ocean','olive','orange','pine','plum','quiet','rapid','red','river','rosy','royal','silver','soft','solar','sunny','swift','velvet'],ends=['anchor','badger','basket','beacon','bird','cabin','cactus','canyon','castle','cloud','comet','dolphin','falcon','field','forest','garden','harbor','lantern','meadow','mountain','oak','panda','pepper','planet','puzzle','rocket','sparrow','stone','summit','trail','willow','window'],words=starts.flatMap(a=>ends.map(b=>a+b));function randomIndex(size){const range=0x100000000,limit=Math.floor(range/size)*size,a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%size}function pick(){return words[randomIndex(words.length)]}function make(){let k=Math.max(6,Math.min(8,Math.trunc(Number(n.value))||6)),a=[];while(a.length<k){let word=pick();if(!a.includes(word))a.push(word)}out.textContent=a.join('-');}make();</script></body></html>
